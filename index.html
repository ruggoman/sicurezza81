<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite Sicurezza 81</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #ffffff 0%, #f1f2f6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .dashboard-card {
            background: white;
            padding: 60px 80px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 
                        0 10px 20px rgba(0, 0, 0, 0.04);
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.02);
            max-width: 780px;
        }

        .title-group {
            margin-bottom: 50px;
        }

        h1 { 
            margin: 0;
            font-size: 3.5em;
            font-weight: 900;
            letter-spacing: -2px;
            color: #1e3799; 
            text-transform: uppercase;
        }

        h1 span {
            color: #00a8ff; 
        }

        .subtitle {
            color: #b2bec3;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 10px;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 140px);
            gap: 36px;
            justify-content: center;
        }
        
        .app-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #2d3436;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .app-link:hover { 
            transform: translateY(-12px); 
        }
        
        .icon-box {
            width: 110px;
            height: 110px;
            background: #ffffff;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
            border: 2px solid #f1f2f6;
            transition: all 0.3s ease;
        }
        
        .app-link:hover .icon-box {
            border-color: #00a8ff;
            box-shadow: 0 15px 30px rgba(0, 168, 255, 0.15);
        }
        
        .app-label { 
            font-size: 12px; 
            font-weight: 800; 
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .app-link:hover .app-label {
            color: #1e3799;
        }

        .emergency-arrow {
            width: 60px;
            height: 60px;
            fill: #2ecc71; 
        }
    </style>
</head>
