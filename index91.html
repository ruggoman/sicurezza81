<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite Sicurezza 81</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #ffffff 0%, #f1f2f6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
        }

        .dashboard-card {
            background: white;
            padding: 60px 80px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 
                        0 10px 20px rgba(0, 0, 0, 0.04);
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.02);
            max-width: 780px;
        }

        .title-group {
            margin-bottom: 50px;
        }

        h1 { 
            margin: 0;
            font-size: 3.5em;
            font-weight: 900;
            letter-spacing: -2px;
            color: #1e3799; 
            text-transform: uppercase;
        }

        h1 span {
            color: #00a8ff; 
        }

        .subtitle {
            color: #b2bec3;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 10px;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 140px);
            gap: 36px;
            justify-content: center;
        }
        
        .app-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #2d3436;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .app-link:hover { 
            transform: translateY(-12px); 
        }
        
        .icon-box {
            width: 110px;
            height: 110px;
            background: #ffffff;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 16px;
            border: 2px solid #f1f2f6;
            transition: all 0.3s ease;
        }
        
        .app-link:hover .icon-box {
            border-color: #00a8ff;
            box-shadow: 0 15px 30px rgba(0, 168, 255, 0.15);
        }
        
        .app-label { 
            font-size: 12px; 
            font-weight: 800; 
            color: #636e72;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .app-link:hover .app-label {
            color: #1e3799;
        }

        .emergency-arrow {
            width: 60px;
            height: 60px;
            fill: #2ecc71; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const ArrowIcon = () => (
            <svg className="emergency-arrow" viewBox="0 0 24 24">
                <path d="M5,17.59L15.59,7H9V5H19V15H17V8.41L6.41,19L5,17.59Z" />
            </svg>
        );

        const BrainIcon = () => (
            <svg viewBox="0 0 64 64" width="54" height="54" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="32" cy="32" rx="20" ry="22" fill="#a29bfe" fillOpacity="0.18" stroke="#6c5ce7" strokeWidth="2.2"/>
                <path d="M32 10v44" stroke="#6c5ce7" strokeWidth="1.8" strokeDasharray="3 3" strokeLinecap="round"/>
                <path d="M20 20 Q16 26 18 32" stroke="#6c5ce7" strokeWidth="2" strokeLinecap="round" fill="none"/>
                <path d="M16 32 Q15 38 20 42" stroke="#6c5ce7" strokeWidth="2" strokeLinecap="round" fill="none"/>
                <path d="M44 20 Q48 26 46 32" stroke="#6c5ce7" strokeWidth="2" strokeLinecap="round" fill="none"/>
                <path d="M48 32 Q49 38 44 42" stroke="#6c5ce7" strokeWidth="2" strokeLinecap="round" fill="none"/>
                <path d="M22 25 Q27 22 32 24 Q37 22 42 25" stroke="#6c5ce7" strokeWidth="1.8" strokeLinecap="round" fill="none"/>
                <path d="M20 34 Q26 30 32 32 Q38 30 44 34" stroke="#6c5ce7" strokeWidth="1.8" strokeLinecap="round" fill="none"/>
                <path d="M22 43 Q27 40 32 41 Q37 40 42 43" stroke="#6c5ce7" strokeWidth="1.8" strokeLinecap="round" fill="none"/>
            </svg>
        );

        const OcraIcon = () => (
            <svg viewBox="0 0 64 64" width="54" height="54" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 45 L20 35 Q20 30 25 30 L35 30 Q40 30 40 35 L40 45" stroke="#e67e22" strokeWidth="2.5" strokeLinecap="round"/>
                <circle cx="30" cy="20" r="6" stroke="#e67e22" strokeWidth="2.5"/>
                <path d="M40 35 L50 30" stroke="#e67e22" strokeWidth="2.5" strokeLinecap="round"/>
                <rect x="22" y="45" width="16" height="8" rx="2" fill="#e67e22" fillOpacity="0.18" stroke="#e67e22" strokeWidth="2"/>
                <path d="M30 30 L30 45" stroke="#e67e22" strokeWidth="1.5" strokeDasharray="2 2"/>
            </svg>
        );

        const RumoreIcon = () => (
            <svg viewBox="0 0 64 64" width="54" height="54" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="8" y="24" width="10" height="16" rx="2" fill="#0984e3" fillOpacity="0.18" stroke="#0984e3" strokeWidth="2.2"/>
                <path d="M18 24 L28 14 L28 50 L18 40 Z" fill="#0984e3" fillOpacity="0.22" stroke="#0984e3" strokeWidth="2.2" strokeLinejoin="round"/>
                <path d="M34 22 Q40 32 34 42" stroke="#0984e3" strokeWidth="2.4" strokeLinecap="round" fill="none"/>
                <path d="M39 17 Q48 32 39 47" stroke="#0984e3" strokeWidth="2.2" strokeLinecap="round" fill="none" strokeOpacity="0.7"/>
                <path d="M44 12 Q56 32 44 52" stroke="#0984e3" strokeWidth="2" strokeLinecap="round" fill="none" strokeOpacity="0.4"/>
            </svg>
        );

        const VibrazioniIcon = () => (
            <svg viewBox="0 0 64 64" width="54" height="54" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 26 Q10 32 15 38" stroke="#d63031" strokeWidth="2.4" strokeLinecap="round" fill="none"/>
                <path d="M10 22 Q3  32 10 42" stroke="#d63031" strokeWidth="2.0" strokeLinecap="round" fill="none" strokeOpacity="0.5"/>
                <path d="M49 26 Q54 32 49 38" stroke="#d63031" strokeWidth="2.4" strokeLinecap="round" fill="none"/>
                <path d="M54 22 Q61 32 54 42" stroke="#d63031" strokeWidth="2.0" strokeLinecap="round" fill="none" strokeOpacity="0.5"/>
                <rect x="19" y="19" width="26" height="26" rx="6" fill="#d63031" fillOpacity="0.15" stroke="#d63031" strokeWidth="2.4"/>
            </svg>
        );

        const IncendioIcon = () => (
            <svg viewBox="0 0 64 64" width="54" height="54" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 52 C18 52 10 40 14 30 C16 24 13 18 16 12 C18 18 17 24 22 28 C20 22 22 16 26 10 C26 10 24 24 30 30 C28 22 30 16 34 8 C34 8 36 22 42 28 C46 24 45 18 47 12 C50 18 47 24 49 30 C53 40 46 52 46 52 Z"
                    fill="#e05a1f" fillOpacity="0.22" stroke="#e05a1f" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
                <path d="M24 52 C24 52 18 43 20 35 C21 29 19 24 22 18 C23 24 22 29 26 33 C25 27 27 21 30 16 C30 16 29 28 35 34 C33 27 35 21 38 16 C40 22 38 29 40 35 C42 43 38 52 38 52 Z"
                    fill="#f39c12" fillOpacity="0.40" stroke="#f39c12" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"/>
                <path d="M28 52 C28 52 24 46 25 40 C26 35 24 31 26 26 C28 31 27 35 30 38 C29 33 31 28 33 24 C35 28 34 33 36 38 C38 34 37 30 38 26 C40 31 38 35 39 40 C40 46 36 52 36 52 Z"
                    fill="#f1c40f" fillOpacity="0.65" stroke="#f1c40f" strokeWidth="1.4" strokeLinejoin="round" strokeLinecap="round"/>
            </svg>
        );

        const MolestieIcon = () => (
            <svg viewBox="0 0 64 64" width="54" height="54" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="16" cy="16" r="5" stroke="#c0392b" strokeWidth="2.2"/>
                <path d="M16 21 L16 36" stroke="#c0392b" strokeWidth="2.2" strokeLinecap="round"/>
                <path d="M16 27 L10 31" stroke="#c0392b" strokeWidth="2.2" strokeLinecap="round"/>
                <path d="M16 27 L22 31" stroke="#c0392b" strokeWidth="2.2" strokeLinecap="round"/>
                <path d="M16 36 L12 46" stroke="#c0392b" strokeWidth="2.2" strokeLinecap="round"/>
                <path d="M16 36 L20 46" stroke="#c0392b" strokeWidth="2.2" strokeLinecap="round"/>
                <path d="M32 18 L32 50" stroke="#7f8c8d" strokeWidth="2" strokeLinecap="round" strokeDasharray="4 3"/>
                <path d="M29 26 Q32 22 35 26 L35 40 Q32 44 29 40 Z" fill="#27ae60" fillOpacity="0.20" stroke="#27ae60" strokeWidth="2"/>
                <circle cx="48" cy="16" r="5" stroke="#2980b9" strokeWidth="2.2"/>
                <path d="M48 21 L48 36" stroke="#2980b9" strokeWidth="2.2" strokeLinecap="round"/>
                <path d="M48 27 L42 31" stroke="#2980b9" strokeWidth="2.2" strokeLinecap="round"/>
                <path d="M48 27 L54 31" stroke="#2980b9" strokeWidth="2.2" strokeLinecap="round"/>
                <path d="M48 36 L44 46" stroke="#2980b9" strokeWidth="2.2" strokeLinecap="round"/>
                <path d="M48 36 L52 46" stroke="#2980b9" strokeWidth="2.2" strokeLinecap="round"/>
            </svg>
        );

        const CancerogeniIcon = () => (
            <svg viewBox="0 0 64 64" width="54" height="54" xmlns="http://www.w3.org/2000/svg">
                <polygon points="32,2 62,32 32,62 2,32" fill="#fff" stroke="#e00" strokeWidth="5.5"/>
                <polygon points="32,9 55,32 32,55 9,32" fill="#fff"/>
                <circle cx="32" cy="18" r="7" fill="#111"/>
                <rect x="29" y="25" width="6" height="4" rx="1" fill="#111"/>
                <path d="M19,29 Q14,38 16,48 L48,48 Q50,38 45,29 Z" fill="#111"/>
                <ellipse cx="17" cy="31" rx="5" ry="4" fill="#111"/>
                <ellipse cx="47" cy="31" rx="5" ry="4" fill="#111"/>
                <line x1="32" y1="37" x2="32" y2="28" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/>
                <line x1="32" y1="37" x2="39" y2="30" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/>
                <line x1="32" y1="37" x2="25" y2="30" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/>
                <line x1="32" y1="37" x2="41" y2="37" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/>
                <line x1="32" y1="37" x2="23" y2="37" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/>
                <line x1="32" y1="37" x2="39" y2="44" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/>
                <line x1="32" y1="37" x2="25" y2="44" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/>
                <line x1="32" y1="37" x2="32" y2="46" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/>
            </svg>
        );

        /* Icona Clima Severo: sole (caldo) + fiocco di neve (freddo) combinati */
        const ClimaIcon = () => (
            <svg viewBox="0 0 64 64" width="54" height="54" fill="none" xmlns="http://www.w3.org/2000/svg">
                {/* --- SOLE (metà sinistra) --- */}
                {/* Raggi del sole */}
                <line x1="13" y1="32" x2="8"  y2="32" stroke="#f39c12" strokeWidth="2.2" strokeLinecap="round"/>
                <line x1="16" y1="23" x2="12" y2="19" stroke="#f39c12" strokeWidth="2.2" strokeLinecap="round"/>
                <line x1="23" y1="16" x2="19" y2="12" stroke="#f39c12" strokeWidth="2.2" strokeLinecap="round"/>
                <line x1="32" y1="13" x2="32" y2="8"  stroke="#f39c12" strokeWidth="2.2" strokeLinecap="round"/>
                <line x1="41" y1="16" x2="45" y2="12" stroke="#f39c12" strokeWidth="2.2" strokeLinecap="round"/>
                {/* Corpo del sole (cerchio pieno caldo) */}
                <circle cx="32" cy="32" r="10" fill="#f39c12" fillOpacity="0.25" stroke="#f39c12" strokeWidth="2.2"/>
                {/* Maschera per tagliare il sole a metà sinistra — sovrascriviamo con la metà destra fredda */}

                {/* --- FIOCCO DI NEVE (metà destra) --- */}
                {/* Asse verticale */}
                <line x1="32" y1="19" x2="32" y2="45" stroke="#3498db" strokeWidth="2.2" strokeLinecap="round"/>
                {/* Asse orizzontale */}
                <line x1="32" y1="32" x2="51" y2="32" stroke="#3498db" strokeWidth="2.2" strokeLinecap="round"/>
                {/* Diagonale alto-destra */}
                <line x1="32" y1="32" x2="45" y2="19" stroke="#3498db" strokeWidth="2.2" strokeLinecap="round"/>
                {/* Diagonale basso-destra */}
                <line x1="32" y1="32" x2="45" y2="45" stroke="#3498db" strokeWidth="2.2" strokeLinecap="round"/>
                {/* Piccoli rami sui raggi del fiocco */}
                <line x1="32" y1="23" x2="35" y2="20" stroke="#3498db" strokeWidth="1.6" strokeLinecap="round"/>
                <line x1="32" y1="23" x2="29" y2="20" stroke="#3498db" strokeWidth="1.6" strokeLinecap="round"/>
                <line x1="32" y1="41" x2="35" y2="44" stroke="#3498db" strokeWidth="1.6" strokeLinecap="round"/>
                <line x1="32" y1="41" x2="29" y2="44" stroke="#3498db" strokeWidth="1.6" strokeLinecap="round"/>
                <line x1="44" y1="32" x2="47" y2="29" stroke="#3498db" strokeWidth="1.6" strokeLinecap="round"/>
                <line x1="44" y1="32" x2="47" y2="35" stroke="#3498db" strokeWidth="1.6" strokeLinecap="round"/>
                <line x1="38.5" y1="25.5" x2="41.5" y2="22.5" stroke="#3498db" strokeWidth="1.6" strokeLinecap="round"/>
                <line x1="38.5" y1="25.5" x2="41.5" y2="28.5" stroke="#3498db" strokeWidth="1.6" strokeLinecap="round"/>
                <line x1="38.5" y1="38.5" x2="41.5" y2="35.5" stroke="#3498db" strokeWidth="1.6" strokeLinecap="round"/>
                <line x1="38.5" y1="38.5" x2="41.5" y2="41.5" stroke="#3498db" strokeWidth="1.6" strokeLinecap="round"/>
                {/* Raggi caldi rimasti a sinistra e in basso */}
                <line x1="16" y1="41" x2="12" y2="45" stroke="#f39c12" strokeWidth="2.2" strokeLinecap="round"/>
                <line x1="23" y1="48" x2="19" y2="52" stroke="#f39c12" strokeWidth="2.2" strokeLinecap="round"/>
                <line x1="32" y1="51" x2="32" y2="56" stroke="#f39c12" strokeWidth="2.2" strokeLinecap="round"/>
                {/* Linea divisoria verticale centrale */}
                <line x1="32" y1="6" x2="32" y2="58" stroke="#dfe6e9" strokeWidth="1.2" strokeLinecap="round" strokeDasharray="2 3"/>
            </svg>
        );

        const apps = [
            { 
                name: "Planimetrie", 
                url: "https://ruggoman.github.io/crea-piantine/", 
                icon: <ArrowIcon />
            },
            { 
                name: "Organigrammi", 
                url: "https://ruggoman.github.io/organigramma/", 
                icon: "\u{1F465}"
            },
            { 
                name: "Analisi DVR", 
                url: "https://ruggoman.github.io/matrice-rischi/", 
                icon: "\u{1F6E1}\uFE0F"
            },
            { 
                name: "Rapportini", 
                url: "https://ruggoman.github.io/rapportini/", 
                icon: "\u{1F4CB}"
            },
            {
                name: "SLC",
                url: "https://ruggoman.github.io/stress/",
                icon: <BrainIcon />
            },
            {
                name: "Valutazione OCRA",
                url: "https://ruggoman.github.io/ocra/",
                icon: <OcraIcon />
            },
            {
                name: "Rischio Rumore",
                url: "https://ruggoman.github.io/rumore/",
                icon: <RumoreIcon />
            },
            {
                name: "Rischio Vibrazioni",
                url: "https://ruggoman.github.io/vibrazioni/",
                icon: <VibrazioniIcon />
            },
            {
                name: "Molestie",
                url: "https://ruggoman.github.io/molestie/",
                icon: <MolestieIcon />
            },
            {
                name: "Rischio Incendio",
                url: "https://ruggoman.github.io/incendio/",
                icon: <IncendioIcon />
            },
            {
                name: "Cancerogeni",
                url: "https://ruggoman.github.io/cancerogeno/",
                icon: <CancerogeniIcon />
            },
            {
                name: "Clima Severo",
                url: "https://ruggoman.github.io/climasevero/",
                icon: <ClimaIcon />
            },
        ];

        function Dashboard() {
            return (
                <div className="dashboard-card">
                    <div className="title-group">
                        <h1>Suite Sicurezza <span>81</span></h1>
                        <div className="subtitle">Console Strumenti Tecnici</div>
                    </div>
                    
                    <div className="grid">
                        {apps.map(app => (
                            <a key={app.name} href={app.url} target="_blank" className="app-link" rel="noopener noreferrer">
                                <div className="icon-box">{app.icon}</div>
                                <span className="app-label">{app.name}</span>
                            </a>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
